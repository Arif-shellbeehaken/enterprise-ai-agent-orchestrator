# Production overlay – use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required env (export or .env):
#   SECRET_KEY, CORS_ORIGINS, POSTGRES_PASSWORD

services:
  db:
    ports: []  # do not expose Postgres publicly
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: always

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      DATABASE_URL: postgresql+asyncpg://orchestrator:${POSTGRES_PASSWORD}@db:5432/orchestrator
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "40"
    ports:
      - "8000:8000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
